name: Read-only production exterior image verification
on:
  push:
    branches:
      - test/store-image-acquisition-20261128
    paths:
      - .github/workflows/store-image-acquisition-test.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify live site, exact registry entry and image bytes
        run: |
          set -euo pipefail
          base=https://k3-track.occompass-info.workers.dev
          mkdir -p /tmp/k3-live-check
          cd /tmp/k3-live-check
          for f in browse.html store.html app.js store.js store-visuals.json assets/store-opus-nobeoka.jpg; do
            out="${f##*/}"
            curl --fail --location --max-time 20 --proto '=https' --proto-redir '=https' -D "$out.headers" -o "$out" "$base/$f"
            echo "$f : $(wc -c < "$out") bytes"
          done
          grep -i '^x-k3-build:' store.html.headers
          grep -F 'store-visual-first-20261128-12' store.html.headers
          echo '0c6ffacc4edda3d321133d66bbccae6ed0801c89148191cc43bd7b4d9c1ce5bd  store-opus-nobeoka.jpg' | sha256sum -c
          test "$(file -b --mime-type store-opus-nobeoka.jpg)" = image/jpeg
          node - <<'JS'
          const fs=require('fs'), assert=require('assert');
          const r=JSON.parse(fs.readFileSync('store-visuals.json','utf8'));
          const name='オーパス666延岡店';
          for(const path of ['app.js','store.js']){
            const s=fs.readFileSync(path,'utf8');
            const gate=new Function(s.match(/function approvedStoreVisual[\s\S]*?\n}/)[0]+';return approvedStoreVisual')();
            assert.equal(gate(name,r).image,'./assets/store-opus-nobeoka.jpg');
            assert.deepEqual(Object.keys(r.stores).filter(n=>gate(n,r)),[name]);
          }
          assert(fs.readFileSync('browse.html','utf8').includes('app.js?v=store-visual-first-20261128-12'));
          assert(fs.readFileSync('store.html','utf8').includes('store.js?v=store-visual-first-20261128-12'));
          console.log('LIVE_REGISTRY_AND_ASSET_OK; browser rendering not tested');
          JS
