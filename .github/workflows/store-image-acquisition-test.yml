name: One-time store image acquisition test
on:
  push:
    branches:
      - test/store-image-acquisition-20261128
    paths:
      - .github/workflows/store-image-acquisition-test.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acquire and validate nine official photos
        run: |
          set -euo pipefail
          mkdir -p /tmp/store-image-check
          while read -r slug path; do
            out="/tmp/store-image-check/store-towars-${slug}.jpg"
            curl --fail --location --max-time 30 --proto '=https' --proto-redir '=https' --output "$out" "https://www.towars.com/wp-content/uploads/$path"
            test "$(file -b --mime-type "$out")" = image/jpeg
            test "$(wc -c < "$out")" -le 1000000
            file "$out"
            sha256sum "$out"
          done <<'SOURCES'
          nishihachi 2022/10/hall_list_05-1.jpg
          yotsuya 2016/08/hall_list_04.jpg
          sagamihara 2016/08/hall_list_19.jpg
          asamizodai 2016/08/hall_list_27.jpg
          kanouya 2022/10/hall_list_16-1.jpg
          atsugi 2016/08/hall_list_22.jpg
          yamatofukami 2016/08/hall_list_36.jpg
          yamato 2016/08/hall_list_25.jpg
          fujisawa 2016/08/hall_list_30.jpg
          SOURCES
          test "$(find /tmp/store-image-check -name '*.jpg' | wc -l)" -eq 9
      - name: Save candidates for manual review (not production)
        uses: actions/upload-artifact@v4
        with:
          name: k3-towars-nine-candidates
          path: /tmp/store-image-check/*.jpg
          retention-days: 1
          if-no-files-found: error
