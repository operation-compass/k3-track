name: One-time store image acquisition test
on:
  push:
    branches:
      - test/store-image-acquisition-20261128
    paths:
      - .github/workflows/store-image-acquisition-test.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: omega
            url: https://omega.gr.jp/
          - name: espace
            url: https://e-space.co.jp/list-2/
          - name: stadium
            url: https://www.yashirogroup.co.jp/shop.html
    steps:
      - name: Inspect public operator page for image sources
        env:
          PAGE_URL: ${{ matrix.url }}
        run: |
          set -euo pipefail
          curl --fail --location --max-time 20 --proto '=https' --proto-redir '=https' --output /tmp/operator.html "$PAGE_URL"
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          import os
          class Parser(HTMLParser):
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='img':
                      print('IMAGE',a.get('alt','')[:120],urljoin(os.environ['PAGE_URL'],a.get('src') or a.get('data-src') or ''))
                  elif tag=='link' and a.get('as')=='image':
                      print('IMAGE LINK',urljoin(os.environ['PAGE_URL'],a.get('href','')))
          p=Parser()
          p.feed(open('/tmp/operator.html',encoding='utf-8',errors='replace').read())
          PY
